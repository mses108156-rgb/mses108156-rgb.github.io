<style>

    margin:0;

body{
    font-family:'Noto Sans TC',sans-serif;

        linear-gradient(rgba(8,18,35,.75),rgba(8,18,35,.85)),

<body>

<div class="container">

    <h1 class="title">✦ 提瓦特 1A2B ✦</h1>
    <p class="subtitle">
        猜出神秘的四位數字（數字不重複）
    </p>

    <div class="panel">

        <div class="input-area">
            <input
                id="guessInput"
                maxlength="4"
                placeholder="輸入4位數"
            >
            <button class="guess-btn" onclick="guessNumber()">
                猜測
            </button>
        </div>

        <div class="info">
            <div class="status" id="message">
                開始冒險吧！
            </div>
            <div>
                次數：<span id="count">0</span>
            </div>
        </div>

        <button class="restart-btn" onclick="newGame()">
            重新開始
        </button>

        <div class="victory" id="victory">
            🎉 恭喜你找到提瓦特的秘密數字！
        </div>

        <div class="history" id="history"></div>

    </div>

    <div class="footer">
        Genshin-inspired Style • 1A2B Number Game
    </div>

</div>

<script>

let answer = "";
let count = 0;
let gameOver = false;

function generateAnswer(){

    let nums = [];

    while(nums.length < 4){

        let n = Math.floor(Math.random()*10).toString();

        if(!nums.includes(n)){
            nums.push(n);
        }
    }

    return nums.join("");
}

function newGame(){

    answer = generateAnswer();
    count = 0;
    gameOver = false;

    document.getElementById("count").textContent = 0;
    document.getElementById("history").innerHTML = "";
    document.getElementById("victory").style.display = "none";
    document.getElementById("message").textContent = "新的冒險開始！";

    console.log("答案:",answer);
}

function validInput(str){

    if(!/^\d{4}$/.test(str))
        return false;

    let set = new Set(str);

    return set.size === 4;
}

function calculateAB(guess){

    let A = 0;
    let B = 0;

    for(let i=0;i<4;i++){

        if(guess[i] === answer[i]){
            A++;
        }
        else if(answer.includes(guess[i])){
            B++;
        }
    }

    return {A,B};
}

function guessNumber(){

    if(gameOver) return;

    let input = document.getElementById("guessInput");
    let guess = input.value.trim();

    if(!validInput(guess)){
        document.getElementById("message").textContent =
        "請輸入不重複的4位數字！";
        return;
    }

    count++;
    document.getElementById("count").textContent = count;

    let result = calculateAB(guess);

    let item = document.createElement("div");
    item.className = "history-item";

    item.innerHTML =
    `
    <span>第 ${count} 次：${guess}</span>
    <span class="result">${result.A}A${result.B}B</span>
    `;

    document.getElementById("history")
    .prepend(item);

    if(result.A === 4){

        gameOver = true;

        document.getElementById("message").textContent =
        `成功解開秘密數字：${answer}`;

        let victory =
        document.getElementById("victory");

        victory.style.display = "block";
        victory.classList.add("win");

        createFireworks();

    }else{

        document.getElementById("message").textContent =
        `${result.A}A${result.B}B，繼續努力！`;
    }

    input.value = "";
}

function createFireworks(){

    for(let i=0;i<40;i++){

        let star = document.createElement("div");

        star.style.position="fixed";
        star.style.left=Math.random()*100+"vw";
        star.style.top=Math.random()*100+"vh";
        star.style.width="8px";
        star.style.height="8px";
        star.style.borderRadius="50%";
        star.style.background=
        ["#ffd700","#fff","#89c4ff","#ffcc88"]
        [Math.floor(Math.random()*4)];

        star.style.pointerEvents="none";
        star.style.zIndex="9999";

        document.body.appendChild(star);

        star.animate(
        [
            {
                transform:"scale(0)",
                opacity:1
            },
            {
                transform:"scale(3)",
                opacity:0
            }
        ],
        {
            duration:1500,
            easing:"ease-out"
        });

        setTimeout(()=>{
            star.remove();
        },1500);
    }
}

document.getElementById("guessInput")
.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
        guessNumber();
    }
});

newGame();

</script>

</body>
