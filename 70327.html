<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>塔羅風格 - 狼人殺判定</title>
    <style>
        body { background: #1a1a2e; color: #e0e0e0; font-family: 'Times New Roman', serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        textarea { width: 100%; height: 100px; background: #16213e; color: #fff; border: 1px solid #484b6a; padding: 10px; margin-bottom: 15px; }
        
        /* 塔羅牌設計 */
        #playerGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 20px; margin-top: 30px; }
        .tarot-card { 
            background: #0f3460; border: 2px solid #c9a227; border-radius: 10px; padding: 10px;
            position: relative; overflow: hidden; height: 180px; transition: transform 0.3s;
        }
        .tarot-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(201, 162, 39, 0.4); }
        
        /* 角色圖標與名稱 */
        .card-icon { font-size: 3em; display: block; margin-top: 10px; }
        .card-title { color: #c9a227; font-size: 0.9em; font-weight: bold; text-transform: uppercase; margin-top: 5px; display: block; }
        .player-num { position: absolute; top: 5px; left: 10px; font-size: 0.8em; color: #888; }

        /* 淘汰狀態 - 變暗且加上死神意象 */
        .eliminated { filter: grayscale(100%) brightness(40%); border-color: #555; }
        .eliminated::after { 
            content: "DEATH"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg);
            color: #ff0000; font-size: 1.5em; border: 2px solid #ff0000; padding: 2px 10px; opacity: 0.8;
        }

        /* 結果顯示 */
        #result { margin-top: 30px; padding: 20px; font-size: 1.8em; border-radius: 8px; font-weight: bold; }
        .werewolves { background: #5a1212; color: #ff4d4d; border: 2px solid #ff4d4d; }
        .townsfolk { background: #1b4332; color: #40916c; border: 2px solid #40916c; }
        .wrong { background: #b08d0a; color: #000; }
        button { background: #c9a227; color: #1a1a2e; border: none; padding: 10px 30px; cursor: pointer; font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>塔羅牌：狼人殺勝負觀測儀</h1>
    <p>請輸入測資（人數、身分、淘汰編號、0 結束）</p>
    <textarea id="inputData" placeholder="範例格式：
6
0 1 0 1 -1 -1
1
5
0"></textarea>
    <br>
    <button onclick="drawCards()">揭開命運</button>

    <div id="result"></div>
    <div id="playerGrid"></div>
</div>

<script>
    function drawCards() {
        const input = document.getElementById('inputData').value.trim();
        const resultDiv = document.getElementById('result');
        const grid = document.getElementById('playerGrid');
        grid.innerHTML = ''; 
        
        const data = input.split(/\s+/).map(Number);
        if (data.length < 2) return;

        let idx = 0;
        const N = data[idx++]; // 玩家人數 [1]
        const roles = [];      // 玩家身分代碼 [1]
        for (let i = 0; i < N; i++) roles.push(data[idx++]);

        const eliminated = new Array(N).fill(false);
        let isWrong = false;

        // 處理淘汰流程 [1, 2]
        while (idx < data.length) {
            const X = data[idx++];
            if (X === 0) break;
            if (X > 0 && X <= N) {
                if (eliminated[X - 1]) isWrong = true; // 重複淘汰判定 [1]
                eliminated[X - 1] = true;
            }
        }

        // 渲染塔羅牌
        for (let i = 0; i < N; i++) {
            const card = document.createElement('div');
            card.className = 'tarot-card' + (eliminated[i] ? ' eliminated' : '');
            
            let icon = '';
            let tarotName = '';
            
            // 根據來源定義的身分映射塔羅牌 [1]
            if (roles[i] === -1) { icon = '🌙'; tarotName = 'The Moon'; }       // 狼人
            else if (roles[i] === 0) { icon = '🃏'; tarotName = 'The Fool'; }   // 平民
            else if (roles[i] === 1) { icon = '🔮'; tarotName = 'The Magician'; } // 神職

            card.innerHTML = `
                <span class="player-num">NO. ${i + 1}</span>
                <span class="card-icon">${icon}</span>
                <span class="card-title">${tarotName}</span>
            `;
            grid.appendChild(card);
        }

        // 勝負判定邏輯 [1, 2]
        if (isWrong) {
            resultDiv.innerText = "命運糾纏：Wrong";
            resultDiv.className = 'wrong';
        } else {
            let wolfSurvives = false;
            for (let i = 0; i < N; i++) {
                if (!eliminated[i] && roles[i] === -1) wolfSurvives = true;
            }

            if (wolfSurvives) {
                resultDiv.innerText = "暗月降臨：Werewolves";
                resultDiv.className = 'werewolves';
            } else {
                resultDiv.innerText = "黎明升起：Townsfolk";
                resultDiv.className = 'townsfolk';
            }
        }
    }
</script>
</body>
</html>
